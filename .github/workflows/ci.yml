name: CI Analytics Pipeline & Quality Audit

on:
  push:
    branches: [ "main", "audit/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic Relational Dataset
        run: |
          python scripts/generate_data.py

      - name: Execute DuckDB Data Modeling Pipeline
        run: |
          python models/run_models.py

      - name: Run Behavioral RFM & Retention Analysis
        run: |
          python analysis/retention_analysis.py

      - name: Run Pytest Quality & Mathematical Invariant Suite
        run: |
          pytest -v tests/test_metrics.py
